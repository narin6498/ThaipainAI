<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ThaiPainAI Camera Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#062e24;color:#173d32}
main{max-width:620px;margin:auto;min-height:100vh;background:#f6f1e7;padding:16px}
h1{color:#073f31;margin:4px 0 6px}.sub{color:#607269;margin-bottom:12px}
video{width:100%;height:56vh;min-height:320px;object-fit:cover;background:#111;border-radius:18px}
button{width:100%;min-height:52px;margin-top:9px;border:0;border-radius:14px;font-size:16px;font-weight:800;background:#0a4b3a;color:white}
.alt{background:#dba936;color:#073f31}.box{margin-top:10px;padding:11px;border-radius:12px;background:white;white-space:pre-wrap;font-size:12px;line-height:1.5}
.err{background:#fff0e7;color:#7b3826}
</style></head>
<body><main>
<h1>ThaiPainAI Camera Test</h1>
<div class="sub">หน้านี้ทดสอบเฉพาะ Camera API — ไม่มี MediaPipe / AI</div>
<video id="v" autoplay muted playsinline></video>
<button onclick="openCam(true)">📷 เปิดกล้องหลัง</button>
<button class="alt" onclick="openCam(false)">🤳 เปิดกล้องหน้า</button>
<button onclick="stopCam()">ปิดกล้อง</button>
<div id="status" class="box">พร้อมทดสอบ</div>
<div id="diag" class="box"></div>
<script>
let stream=null;
const v=document.getElementById('v'),status=document.getElementById('status'),diag=document.getElementById('diag');
function diagnostics(e){
 const a=[
  'secureContext: '+window.isSecureContext,
  'protocol: '+location.protocol,
  'host: '+location.host,
  'mediaDevices: '+!!navigator.mediaDevices,
  'getUserMedia: '+!!navigator.mediaDevices?.getUserMedia,
  'UA: '+navigator.userAgent
 ];
 if(e)a.push('ERROR: '+(e.name||'Error')+' — '+(e.message||e));
 diag.textContent=a.join('\n');
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;status.textContent='ปิดกล้องแล้ว'}
async function openCam(rear){
 stopCam();diagnostics();
 try{
  if(!window.isSecureContext)throw new Error('ต้องเปิดผ่าน HTTPS');
  stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:{ideal:rear?'environment':'user'}}
  });
  v.srcObject=stream;v.playsInline=true;v.muted=true;await v.play();
  const st=stream.getVideoTracks()[0]?.getSettings?.()||{};
  status.className='box';
  status.textContent='เปิดกล้องสำเร็จ ✓\n'+JSON.stringify(st,null,2);
  diagnostics();
 }catch(e){
  status.className='box err';
  status.textContent='เปิดกล้องไม่ได้\n'+(e.name||'Error')+' — '+(e.message||e)+
   '\n\nNotAllowedError = สิทธิ์กล้องถูก Block/ปฏิเสธ\nNotFoundError = ไม่พบกล้อง\nNotReadableError = กล้องถูกแอปอื่นใช้งาน';
  diagnostics(e);
 }
}
diagnostics();
</script></main></body></html>
